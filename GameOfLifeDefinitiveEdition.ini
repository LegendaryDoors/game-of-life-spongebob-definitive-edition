; The Game of Life: SpongeBob SquarePants Edition - Definitive Edition
; The game renders at 800x600; the patch scales the finished frame to your screen.

[Display]

; 0 runs the game unpatched.
Enabled=1

; proxy scales here and enables Filter; runtime lets Direct3D stretch.
Method=proxy

; fullscreen (borderless) or windowed.
Mode=fullscreen

; 0 = auto. Set both to force a size.
Width=0
Height=0

; Frames per second. 0 = uncapped.
FrameCap=0

; 1 keeps the game running when unfocused. Minimising always pauses.
RunInBackground=0

; sharp, point, or linear. No launcher row; edit here.
Filter=sharp

; 0 keeps 4:3 with black bars. 1 stretches to fill.
Stretch=0
